[project]
name = "baseloop"
version = "0.1.0"
description = "Bass groove generation, playback, practice and music-theory studio"
requires-python = ">=3.11,<3.13"
dependencies = [
    "Flask==2.3.3",
    "gunicorn==21.2.0",
    "numpy==1.26.4",
    "scipy==1.12.0",
    "music21==8.1.0",
    "mido==1.3.0",
    "python-dotenv==1.0.1",
]

[tool.vercel]
entrypoint = "enhanced_app:app"
